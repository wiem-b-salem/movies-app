<ion-tabs>
  <ion-tab-bar slot="bottom">
    <ion-tab-button tab="movies">
      <ion-icon name="film"></ion-icon>
      <ion-label>Films</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="playlist">
      <ion-icon name="heart"></ion-icon>
      <ion-label>Playlist</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="matching">
      <ion-icon name="people"></ion-icon>
      <ion-label>Matching</ion-label>
    </ion-tab-button>

    @if (isAdmin()) {
      <ion-tab-button tab="admin-add-movie">
        <ion-icon name="shield-checkmark"></ion-icon>
        <ion-label>Ajouter</ion-label>
      </ion-tab-button>

      <ion-tab-button tab="admin-users">
        <ion-icon name="people"></ion-icon>
        <ion-label>Utilisateurs</ion-label>
      </ion-tab-button>
    }

    <ion-tab-button tab="profile">
      <ion-icon name="person"></ion-icon>
      <ion-label>Profil</ion-label>
    </ion-tab-button>
  </ion-tab-bar>
</ion-tabs>
