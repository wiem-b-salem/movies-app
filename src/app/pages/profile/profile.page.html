<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start"><ion-back-button defaultHref="/movies"></ion-back-button></ion-buttons>
    <ion-title>Mon profil</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  @if (profile(); as p) {
    <div class="ion-text-center ion-margin-bottom">
      <ion-avatar style="margin:auto;width:120px;height:120px">
        <img [src]="p.photo" alt="Photo de profil" />
      </ion-avatar>
      <h2>{{ p.prenom }} {{ p.nom }}</h2>
    </div>

    <ion-list>
      <ion-item><ion-label>Email : {{ p.email }}</ion-label></ion-item>
      <ion-item><ion-label>Âge : {{ p.age }} ans</ion-label></ion-item>
      <ion-item><ion-label>Rôle : {{ p.role === 'admin' ? 'Administrateur' : 'Utilisateur' }}</ion-label></ion-item>
    </ion-list>

    <ion-button expand="block" color="danger" class="ion-margin-top" (click)="logout()">
      Déconnexion
    </ion-button>
  }
</ion-content>
