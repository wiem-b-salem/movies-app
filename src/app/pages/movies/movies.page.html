<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Films</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  @if (loading()) {
    <div class="center">
      <ion-spinner name="crescent"></ion-spinner>
    </div>
  } @else if (error()) {
    <div class="center">
      <p>{{ error() }}</p>
      <ion-button (click)="loadMovies()">Réessayer</ion-button>
    </div>
  } @else {
    <div class="grid">
      @for (movie of movies(); track movie.id) {
        <ion-card class="movie-card" [button]="true" [routerLink]="['/movie-details', movie.id]">
          @if (movie.posterUrl) {
            <img [src]="movie.posterUrl" [alt]="movie.title" />
          } @else {
            <div class="no-poster">Pas d'affiche</div>
          }
          <ion-card-header>
            <ion-card-title>{{ movie.title }}</ion-card-title>
            <ion-card-subtitle>
              {{ movie.releaseDate.slice(0, 4) }} · ⭐ {{ movie.rating.toFixed(1) }}
            </ion-card-subtitle>
          </ion-card-header>
        </ion-card>
      }
    </div>
  }
</ion-content>
