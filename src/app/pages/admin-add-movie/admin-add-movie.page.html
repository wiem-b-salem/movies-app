<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Ajouter un film</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  <ion-item>
    <ion-input label="Titre" labelPlacement="floating" [(ngModel)]="title"></ion-input>
  </ion-item>

  <ion-item>
    <ion-textarea label="Description" labelPlacement="floating" [autoGrow]="true" [(ngModel)]="overview"></ion-textarea>
  </ion-item>

  <ion-item>
    <ion-input label="URL de l'affiche" labelPlacement="floating" type="url" [(ngModel)]="posterUrl"></ion-input>
  </ion-item>

  <ion-item>
    <ion-input label="Date de sortie" labelPlacement="floating" type="date" [(ngModel)]="releaseDate"></ion-input>
  </ion-item>

  <ion-item>
    <ion-input label="Note (0 à 10)" labelPlacement="floating" type="number" min="0" max="10" step="0.1" [(ngModel)]="rating"></ion-input>
  </ion-item>

  <ion-button expand="block" class="ion-margin-top" [disabled]="!valid || saving()" (click)="submit()">
    Ajouter
  </ion-button>

  @if (message()) {
    <p [class.error]="isError()">{{ message() }}</p>
  }
</ion-content>
