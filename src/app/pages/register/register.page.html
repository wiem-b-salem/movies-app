<ion-header>
  <ion-toolbar><ion-title>Inscription</ion-title></ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <form [formGroup]="form" (ngSubmit)="submit()">
    <div class="ion-text-center ion-margin-bottom">
      @if (photo()) {
        <ion-avatar style="margin:auto;width:110px;height:110px">
          <img [src]="photo()" alt="Ma photo" />
        </ion-avatar>
      } @else {
        <ion-icon name="person-circle" style="font-size:110px;color:var(--ion-color-medium)"></ion-icon>
      }
      <div>
        <ion-button fill="outline" size="small" (click)="takePhoto()">
          <ion-icon name="camera" slot="start"></ion-icon>
          {{ photo() ? 'Changer la photo' : 'Prendre une photo' }}
        </ion-button>
      </div>
    </div>

    <ion-input label="Nom" labelPlacement="floating" fill="outline" formControlName="nom" class="ion-margin-bottom"></ion-input>
    <ion-input label="Prénom" labelPlacement="floating" fill="outline" formControlName="prenom" class="ion-margin-bottom"></ion-input>
    <ion-input label="Âge" labelPlacement="floating" fill="outline" type="number" formControlName="age" class="ion-margin-bottom"></ion-input>
    <ion-input label="Email" labelPlacement="floating" fill="outline" type="email" formControlName="email" class="ion-margin-bottom"></ion-input>
    <ion-input label="Mot de passe" labelPlacement="floating" fill="outline" type="password" formControlName="password" class="ion-margin-bottom"></ion-input>

    <ion-button expand="block" type="submit" [disabled]="loading()">
      @if (loading()) { <ion-spinner name="dots"></ion-spinner> } @else { S'inscrire }
    </ion-button>
    <ion-button expand="block" fill="clear" routerLink="/login">J'ai déjà un compte</ion-button>
  </form>
</ion-content>
